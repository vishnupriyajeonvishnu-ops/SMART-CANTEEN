server.port=8080

# Database Configuration (H2 In-Memory with MySQL compatibility, or MySQL if specified)
spring.datasource.url=${DB_URL:jdbc:h2:mem:dmi_canteen_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 In-Memory Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:DMICanteenSuperSecretKeyForJwtAuthenticationSecurityToken2026DmiCollegeEngineering!@#}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# UPI & Payment Details
upi.id=${UPI_ID:mahakavibharath02@okaxis}
upi.payee-name=${UPI_PAYEE_NAME:Kavi}

# AI Chatbot Configuration
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-1.5-flash}

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Scheduling for unpaid order expiration
spring.task.scheduling.pool.size=2

# Date/Time & Jackson Timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# HTTP GZIP Compression for Fast Network Transfer
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Static Resources Browser Caching (1 Year Max-Age for Instant Loading)
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true

# Multipart File Upload for Staff Dish Images
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

