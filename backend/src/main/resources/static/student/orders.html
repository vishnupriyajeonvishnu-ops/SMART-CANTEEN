<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | CampusCanteen</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-body-tertiary">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-surface border-bottom shadow-sm">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                <div class="text-gold fs-4 d-flex align-items-center">
                    <i class="bi bi-egg-fried"></i>
                </div>
                <div>
                    <div class="lh-1">
                        <span class="fw-extrabold text-dark" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.25rem;">Campus</span><span class="fw-extrabold text-gold" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.25rem;">Canteen</span>
                    </div>
                    <small class="text-muted d-block" style="font-size: 10px; font-weight: 500;">Student Portal</small>
                </div>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav">
                <i class="bi bi-list fs-3"></i>
            </button>

            <div class="collapse navbar-collapse" id="studentNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="dashboard.html"><i class="bi bi-grid me-1"></i> Today's Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="orders.html"><i class="bi bi-clock-history me-1"></i> My Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="bills.html"><i class="bi bi-receipt me-1"></i> My Bills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="feedback.html"><i class="bi bi-star me-1"></i> Feedback</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="profile.html"><i class="bi bi-person me-1"></i> Profile</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <button id="themeToggleBtn" class="btn btn-icon btn-outline-secondary" type="button" title="Toggle Theme">
                        <i id="themeToggleIcon" class="bi bi-moon-stars-fill"></i>
                    </button>
                    <a href="dashboard.html" class="btn btn-outline-primary d-flex align-items-center gap-2 px-3">
                        <i class="bi bi-plus-lg"></i>
                        <span>Order More</span>
                    </a>
                    <div class="dropdown ms-2">
                        <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5 text-primary"></i>
                            <span id="navUserName" class="fw-semibold d-none d-md-inline">Student</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="navLogoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container-fluid px-lg-4 py-4" style="max-width: 1100px;">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold mb-1">My Orders & Live Pickup Status</h3>
                <p class="text-muted fs-sm mb-0">Track kitchen preparation in real time and collect hot meals from your counter token.</p>
            </div>
            <button class="btn btn-outline-primary btn-sm rounded-pill px-3" id="btnRefreshOrders">
                <i class="bi bi-arrow-clockwise me-1"></i> Refresh Status
            </button>
        </div>

        <!-- Orders List Container -->
        <div id="ordersContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Loading your orders...</p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { CONFIG, ENDPOINTS } from '../js/config.js';
        import { ApiService } from '../js/api.js';
        import { AuthGuard } from '../js/auth.js';
        import { UI } from '../js/ui.js';
        import { initChatbot } from '../js/chatbot.js';
        import { getFoodImage } from '../js/food-images.js';

        const currentUser = AuthGuard.requireRole([CONFIG.ROLES.STUDENT]);
        if (!currentUser) throw new Error("Unauthorized");

        AuthGuard.setupNavbar();
        UI.initTheme();
        initChatbot();

        const ordersContainer = document.getElementById('ordersContainer');
        const btnRefreshOrders = document.getElementById('btnRefreshOrders');

        // Check for newly placed order in URL params
        const urlParams = new URLSearchParams(window.location.search);
        const newlyPlacedOrderId = urlParams.get('orderId');
        const isCashPending = urlParams.get('cash') === 'true';

        if (newlyPlacedOrderId) {
            const banner = document.createElement('div');
            banner.className = 'alert alert-success alert-dismissible fade show rounded-4 border-0 shadow-sm p-3 mb-4';
            banner.role = 'alert';
            banner.innerHTML = `
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-success-subtle text-success p-2 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
                        <i class="bi bi-check-circle-fill fs-4"></i>
                    </div>
                    <div>
                        <h6 class="alert-heading fw-bold mb-0 text-success">Order #${newlyPlacedOrderId} Placed Successfully!</h6>
                        <small class="text-dark">${isCashPending ? 'Your order is recorded as Cash at Counter. Please pay at the counter register to begin kitchen prep.' : 'Your order is verified and is being prepared.'}</small>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            ordersContainer.parentNode.insertBefore(banner, ordersContainer);
        }

        async function loadOrders() {
            try {
                const res = await ApiService.get(ENDPOINTS.STUDENT_ORDERS);
                const orders = Array.isArray(res) ? res : (res?.data || []);
                renderOrders(orders);
            } catch (err) {
                ordersContainer.innerHTML = `
                    <div class="card border-0 shadow-sm rounded-4 p-5 text-center text-danger">
                        <i class="bi bi-exclamation-triangle fs-1"></i>
                        <p class="mt-2 fw-semibold">Failed to fetch orders: ${err.message}</p>
                    </div>
                `;
            }
        }

        function renderOrders(orders) {
            if (orders.length === 0) {
                ordersContainer.innerHTML = `
                    <div class="card border-0 shadow-sm rounded-4 p-5 text-center text-muted">
                        <i class="bi bi-inbox fs-1 opacity-50"></i>
                        <h5 class="fw-bold mt-3 mb-1">No Orders Placed Yet</h5>
                        <p class="fs-sm mb-3">Explore today's delicious canteen specials and place your first order.</p>
                        <div>
                            <a href="dashboard.html" class="btn btn-primary fw-semibold px-4">Browse Menu</a>
                        </div>
                    </div>
                `;
                return;
            }

            ordersContainer.innerHTML = orders.map(order => {
                const status = order.status; // PLACED, CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED
                const pStatus = order.paymentStatus; // PENDING, SUCCESS, CASH_PENDING, VERIFIED, FAILED

                // Timeline step active states
                const steps = [
                    { key: 'PLACED', label: 'Order Placed', icon: 'bi-file-text' },
                    { key: 'CONFIRMED', label: 'Confirmed', icon: 'bi-check2-circle' },
                    { key: 'PREPARING', label: 'Kitchen Preparing', icon: 'bi-fire' },
                    { key: 'READY', label: 'Ready for Pickup', icon: 'bi-bell-fill' },
                    { key: 'COMPLETED', label: 'Collected', icon: 'bi-bag-check-fill' }
                ];

                const statusOrderMap = { 'PLACED': 0, 'CONFIRMED': 1, 'PREPARING': 2, 'READY': 3, 'COMPLETED': 4 };
                const currentIdx = statusOrderMap[status] !== undefined ? statusOrderMap[status] : -1;

                const isCancelled = status === 'CANCELLED';

                const statusBadgeMap = {
                    'PLACED': '<span class="badge bg-secondary">PLACED</span>',
                    'CONFIRMED': '<span class="badge bg-primary">CONFIRMED</span>',
                    'PREPARING': '<span class="badge bg-warning text-dark"><i class="bi bi-fire me-1"></i>PREPARING</span>',
                    'READY': '<span class="badge bg-success-subtle text-success border border-success fw-bold pulse-green"><i class="bi bi-bell-fill me-1"></i>READY FOR PICKUP</span>',
                    'COMPLETED': '<span class="badge bg-success">COMPLETED</span>',
                    'CANCELLED': '<span class="badge bg-danger">CANCELLED</span>'
                };

                const paymentBadgeMap = {
                    'PENDING': '<span class="badge bg-warning-subtle text-warning border border-warning">UPI PENDING</span>',
                    'SUCCESS': '<span class="badge bg-success-subtle text-success border border-success">UPI SUCCESS</span>',
                    'CASH_PENDING': '<span class="badge bg-info-subtle text-info border border-info">CASH AT COUNTER</span>',
                    'VERIFIED': '<span class="badge bg-success-subtle text-success border border-success">CASH VERIFIED</span>',
                    'FAILED': '<span class="badge bg-danger-subtle text-danger border border-danger">FAILED</span>'
                };

                // Counter tokens
                const counters = (order.items || []).map(i => i.counterName).filter((v, i, a) => a.indexOf(v) === i);
                const counterBadge = `<span class="badge bg-indigo-subtle text-primary border"><i class="bi bi-shop me-1"></i>Pickup Counter: ${counters.join(', ') || 'Food Counter (FC-01)'}</span>`;

                // Quick Action buttons
                let actionBtn = '';
                if (order.paymentMethod === 'GPAY_UPI' && pStatus === 'PENDING') {
                    actionBtn = `<a href="upi-payment.html?orderId=${order.id}" class="btn btn-sm btn-primary fw-bold"><i class="bi bi-qr-code-scan me-1"></i>Complete UPI Payment</a>`;
                } else if (order.billId) {
                    actionBtn = `<a href="bills.html" class="btn btn-sm btn-outline-secondary fw-semibold"><i class="bi bi-receipt me-1"></i>View Bill</a>`;
                }

                if (status === 'COMPLETED') {
                    actionBtn += `<a href="feedback.html" class="btn btn-sm btn-outline-warning fw-semibold ms-2"><i class="bi bi-star-fill text-warning me-1"></i>Rate Items</a>`;
                }

                return `
                    <div class="card border-0 shadow-sm rounded-4 mb-4 bg-surface overflow-hidden">
                        <div class="card-header bg-transparent border-bottom p-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <div>
                                <span class="fw-bold fs-5 me-2">Order #${order.orderNumber || order.id}</span>
                                <span class="text-muted fs-xs">${UI.formatDate(order.orderDate || order.createdAt)}</span>
                                <span class="ms-2 badge bg-light text-dark border">${order.orderType === 'DINE_IN' ? 'Dine In' : 'Take Away'}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                ${paymentBadgeMap[pStatus] || ''}
                                ${statusBadgeMap[status] || ''}
                            </div>
                        </div>

                        <div class="card-body p-3 p-lg-4">
                            <!-- Counter & Token Highlight -->
                            <div class="d-flex flex-wrap justify-content-between align-items-center p-3 rounded-3 bg-body-tertiary mb-3 gap-2">
                                <div>
                                    <div class="fs-xs text-muted text-uppercase fw-bold">Collection Counter</div>
                                    <div class="fw-bold fs-6 text-primary">${counters.join(', ') || 'Food Counter (FC-01)'}</div>
                                </div>
                                <div class="text-end">
                                    <div class="fs-xs text-muted text-uppercase fw-bold">Order Total</div>
                                    <div class="fw-black fs-5 text-dark">${UI.formatCurrency(order.totalAmount)}</div>
                                </div>
                            </div>

                            <!-- Live Progress Timeline (only if not cancelled) -->
                            ${!isCancelled ? `
                                <div class="position-relative my-4 px-2">
                                    <div class="progress" style="height: 4px;">
                                        <div class="progress-bar bg-primary" role="progressbar" style="width: ${(Math.max(0, currentIdx) / (steps.length - 1)) * 100}%;"></div>
                                    </div>
                                    <div class="d-flex justify-content-between position-relative" style="margin-top: -15px;">
                                        ${steps.map((s, idx) => {
                                            const isDone = idx <= currentIdx;
                                            const isCurrent = idx === currentIdx;
                                            return `
                                                <div class="text-center" style="width: 70px;">
                                                    <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center shadow-sm ${isDone ? 'bg-primary text-white' : 'bg-body text-muted border'}" style="width: 30px; height: 30px;">
                                                        <i class="bi ${s.icon} fs-xs"></i>
                                                    </div>
                                                    <small class="d-block mt-1 fs-xxs fw-semibold ${isCurrent ? 'text-primary' : isDone ? 'text-dark' : 'text-muted'}">${s.label}</small>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : `
                                <div class="alert alert-danger py-2 px-3 rounded-3 fs-xs mb-3">
                                    <i class="bi bi-x-circle-fill me-1"></i> This order was cancelled. Reserved inventory was restored back to the canteen.
                                </div>
                            `}

                            <!-- Items Snapshot Table -->
                            <div class="table-responsive">
                                <table class="table table-sm table-borderless mb-0 fs-sm">
                                    <thead>
                                        <tr class="text-muted border-bottom fs-xs">
                                            <th>Dish Item</th>
                                            <th>Counter</th>
                                            <th class="text-center">Qty</th>
                                            <th class="text-end">Price</th>
                                            <th class="text-end">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${(order.items || []).map(item => `
                                            <tr>
                                                <td class="fw-semibold">
                                                    <div class="d-flex align-items-center gap-2">
                                                        <img src="${getFoodImage(item.itemName)}" class="rounded-circle shadow-sm flex-shrink-0" style="width: 34px; height: 34px; object-fit: cover;">
                                                        <span>${item.itemName}</span>
                                                    </div>
                                                </td>
                                                <td><span class="badge bg-secondary-subtle text-secondary fs-xs">${item.counterName}</span></td>
                                                <td class="text-center fw-bold">${item.quantity}</td>
                                                <td class="text-end text-muted">${UI.formatCurrency(item.unitPrice)}</td>
                                                <td class="text-end fw-bold text-dark">${UI.formatCurrency(item.subtotal)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>

                            <!-- Footer Actions -->
                            <div class="d-flex justify-content-between align-items-center pt-3 mt-3 border-top">
                                <span class="fs-xs text-muted">
                                    Payment Method: <strong class="text-dark">${order.paymentMethod === 'GPAY_UPI' ? 'UPI / GPay' : 'Cash at Counter'}</strong>
                                    ${order.utrNumber ? ` | UTR: <strong class="font-monospace">${order.utrNumber}</strong>` : ''}
                                </span>
                                <div>
                                    ${actionBtn}
                                </div>
                            </div>

                        </div>
                    </div>
                `;
            }).join('');
        }

        btnRefreshOrders.addEventListener('click', () => {
            btnRefreshOrders.disabled = true;
            btnRefreshOrders.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Refreshing...`;
            loadOrders().finally(() => {
                btnRefreshOrders.disabled = false;
                btnRefreshOrders.innerHTML = `<i class="bi bi-arrow-clockwise me-1"></i> Refresh Status`;
            });
        });

        loadOrders();
        // Auto-refresh orders status every 6 seconds
        setInterval(loadOrders, 6000);
    </script>
</body>
</html>
